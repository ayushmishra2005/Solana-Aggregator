[package]
name = "solana-agg"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Agave 4.4 RPC client. Message and transaction crates use their own major versions.
solana-client = "=4.4.1"
solana-commitment-config = "3.1.1"
solana-clock = "4.0.0"
solana-hash = "4.7.0"
solana-keypair = "4.0.1"
solana-message = { version = "5.1.0", features = ["serde", "wincode"] }
solana-pubkey = "4.4.0"
solana-signature = "3.6.0"
solana-signer = "4.0.0"
solana-system-interface = { version = "3.3.0", features = ["alloc", "serde", "wincode"] }
solana-transaction = { version = "5.1.0", features = ["serde", "wincode"] }
solana-transaction-error = "4.0.0"
solana-transaction-status = { version = "=4.4.1", features = ["agave-unstable-api"] }
# solana-client 4.4.1 requires tokio ^1.53. The resolved runtime is 1.54.
tokio = "1.54"
futures-util = "0.3.30"
rocksdb = "0.22.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.102"
structopt = { version = "0.3" }
log = "0.4.22"
# 4.18.2 closes the compressed-body advisories. HTTP/2 is left off because
# actix-http 3.21 still depends on the vulnerable h2 0.3 line.
actix-web = { version = "4.18.2", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }

